name: Sincronizar camadas de segurança (manual)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sincronizar pontos de apoio, abrigos e hospitais
        run: npm run db:safety
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
