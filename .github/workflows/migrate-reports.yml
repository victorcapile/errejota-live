name: Aplicar tabelas de relatos (manual)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Criar tabelas de relatos e auditoria
        run: npm run db:migrate-reports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
