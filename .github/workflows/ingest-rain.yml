name: Ingestão de chuva (Alerta Rio)

# O cron da Vercel no plano Hobby roda no máximo uma vez por dia; por isso a
# ingestão de chuva é agendada pelo GitHub Actions.
on:
  schedule:
    # A cada 5 minutos, acompanhando o arquivo oficial (atualiza a cada ~5 min).
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-rain
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.db.outputs.run }}
    steps:
      - id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL não configurada; ingestão ignorada."
          fi

  rain:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingerir chuva
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:rain
